name: Build Demo

on:
  push:
    branches: [ main, master, experiment ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-mac-arm:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci

    - name: Bump Version (Nightly)
      if: github.ref == 'refs/heads/experiment'
      id: version
      run: |
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        TIMESTAMP=$(date +'%Y%m%d%H%M%S')
        NIGHTLY_VERSION="${PACKAGE_VERSION}-nightly.${TIMESTAMP}"
        echo "Setting version to $NIGHTLY_VERSION"
        npm version $NIGHTLY_VERSION --no-git-tag-version
        echo "new_version=$NIGHTLY_VERSION" >> $GITHUB_OUTPUT

    - name: Build Native Module
      run: npm run prebuild -- --arch arm64
      
    - name: Build and Package
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Electron Overlay Demo (macOS ARM64)
        path: release/*.dmg

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: release/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release (Nightly)
      if: github.ref == 'refs/heads/experiment'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.new_version }}
        name: Nightly v${{ steps.version.outputs.new_version }}
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: release/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
